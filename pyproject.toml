[project]
name = "profile-dashboard"
version = "0.2.0"
description = "Generates a live dashboard section in a GitHub profile README"
requires-python = ">=3.12"
authors = [{ name = "Malin Fossum", email = "m.fossum@proton.me" }]
license = { text = "MIT" }
dependencies = [
    "requests>=2.32,<3.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0,<10.0",
    "ruff>=0.6,<1.0",
]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["."]
include = ["src*"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM"]

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
