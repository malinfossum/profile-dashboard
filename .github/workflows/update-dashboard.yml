name: Update dashboard

on:
  schedule:
    # Off-peak minutes: GitHub delays on-the-hour cron heavily (median 2h41m on "0 6").
    # 02:23 UTC aims to land before the Oslo morning; 14:47 UTC backstops a late/dropped run.
    - cron: "23 2 * * *"
    - cron: "47 14 * * *"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: update-dashboard
  cancel-in-progress: true

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout profile-dashboard
        uses: actions/checkout@v7

      - name: Setup Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip

      - name: Install
        run: pip install -e .

      - name: Checkout target profile repo
        uses: actions/checkout@v7
        with:
          repository: malinfossum/malinfossum
          path: target
          token: ${{ secrets.PROFILE_README_TOKEN }}
          persist-credentials: true

      - name: Render dashboard
        env:
          PROFILE_README_TOKEN: ${{ secrets.PROFILE_README_TOKEN }}
        run: |
          python -m src.main --repo malinfossum/malinfossum             --readme-path ./target/README.md             --pill-path ./target/assets/oss-merged.svg             --feature-repo wendhq/wend             --exclude-owner wendhq --exclude-owner funn-team --exclude-language Python --exclude-language CSS --exclude-language HTML             --group focus=tidsro,ignite             --group wellbeing=varde,kenaz             --group momentum=wend,hugin,munin

      - name: Commit and push if changed
        working-directory: target
        run: |
          if git diff --quiet README.md assets/oss-merged.svg; then
            echo "No changes."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add README.md assets/oss-merged.svg
          git commit -m "chore(dashboard): refresh [skip ci]"
          git push
